name: Gerar artes organicas sem custo de API
on:
  push:
    paths:
      - 'sistema/conteudo-organico/**'
      - 'sistema/scripts/generate-organic-media.py'
      - '.github/workflows/gerar-artes-organicas.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar renderizador local
        run: python -m pip install 'Pillow>=10,<13'
      - name: Gerar JPG e manifesto publico
        run: python sistema/scripts/generate-organic-media.py
      - name: Registrar artes no mesmo branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sistema/assets/conteudo-organico
          if ! git diff --cached --quiet; then
            git commit -m 'assets: gerar artes organicas gratuitas'
            git push
          fi
